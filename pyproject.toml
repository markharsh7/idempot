[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "idempot"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "redis>=5.0",
]
readme = "README.md"

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.109",
]
flask = [
    "flask>=3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "fakeredis[lua]>=2.21",
    "ruff>=0.3",
    "mypy>=1.8",
    "fastapi>=0.109",
    "flask>=3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "C4"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["idempot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
